[package]
name = "rust-text-adventure"
version = "2.0.0"
edition = "2021"
authors = ["Ali-Marandi"]
description = "A commercial-grade text-based adventure game with beautiful GUI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
dirs = "6"
