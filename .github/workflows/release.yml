name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri App
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri
          cargo tauri build --bundles none --target x86_64-pc-windows-msvc

      - name: Package executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/RustTextAdventure.exe dist/
          Copy-Item README.md dist/
          Compress-Archive -Path dist/* -DestinationPath RustTextAdventure_windows_x64.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: RustTextAdventure_windows_x64.zip
          name: 'The Rust Laboratory v2.0.0'
          body: |
            ## The Rust Laboratory - Text Adventure Game v2.0.0

            ### Features
            - 14+ interconnected rooms to explore
            - Rich narrative with branching story
            - 20+ collectible items
            - 6 challenging puzzles
            - 13 achievements to unlock
            - Save/Load system with 3 slots
            - Interactive minimap
            - Beautiful cyberpunk dark theme GUI
            - Smart autocomplete command system
            - Command history navigation

            ### Installation
            1. Download `RustTextAdventure_windows_x64.zip`
            2. Extract the ZIP file
            3. Run `RustTextAdventure.exe`

            > Note: Requires WebView2 Runtime (pre-installed on Windows 10/11)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
