[package]
name = "rust-laboratory-signal-zero"
version = "0.1.0"
edition = "2021"
authors = ["Ali-Marandi"]
description = "A polished, narrative-driven laboratory mystery for Windows."
license = "MIT"
repository = "https://github.com/Ali-Marandi/RustTextAdventure"

[dependencies]
eframe = { version = "0.24", default-features = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }
